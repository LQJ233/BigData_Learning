<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img"><defs><marker id="arrow-2563eb" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker><marker id="arrow-059669" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#059669"/></marker><marker id="arrow-d0021b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d0021b"/></marker><marker id="arrow-d97706" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d97706"/></marker><marker id="arrow-7c3aed" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/></marker><marker id="arrow-64748b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#64748b"/></marker><marker id="arrow-94a3b8" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#94a3b8"/></marker></defs><rect width="1240" height="620" fill="#ffffff"/><text x="620" y="34" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">Checkpoint Barrier：注入、流动与对齐</text><rect x="40" y="70" width="1160" height="240" rx="14" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 5"/><text x="56" y="94" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="700" opacity="1">① 单输入链路：Barrier 像普通记录一样流过</text><rect x="70" y="120" width="200" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="170.0" y="149.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">Source</text><text x="170.0" y="169.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">注入 Barrier</text><line x1="276" y1="155" x2="330" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="336" y="120" width="200" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="436.0" y="149.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">map</text><text x="436.0" y="169.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">记录 &amp; Barrier</text><line x1="542" y1="155" x2="596" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="602" y="120" width="200" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="702.0" y="149.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">filter</text><text x="702.0" y="169.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">转发</text><line x1="808" y1="155" x2="862" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="868" y="120" width="300" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1018.0" y="149.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">sink</text><text x="1018.0" y="169.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">收到 Barrier 后 ACK</text><text x="620" y="252" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">Barrier 之前的记录属于本次快照；Barrier 之后的属于下一次快照。</text><rect x="40" y="340" width="1160" height="250" rx="14" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6 5"/><text x="56" y="364" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#d97706" text-anchor="start" font-weight="700" opacity="1">② 双输入算子：Barrier 必须对齐（Alignment）</text><rect x="80" y="400" width="180" height="66" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="170.0" y="427.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">上游 A</text><text x="170.0" y="447.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">并行度 2</text><rect x="80" y="496" width="180" height="66" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="170.0" y="523.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">上游 B</text><text x="170.0" y="543.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">并行度 2</text><line x1="266" y1="433" x2="470" y2="460" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><line x1="266" y1="529" x2="470" y2="486" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="476" y="400" width="260" height="166" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="606.0" y="477.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">window / join</text><text x="606.0" y="497.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">多输入算子</text><line x1="742" y1="483" x2="800" y2="483" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="806" y="440" width="170" height="86" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="891.0" y="477.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">等齐两条</text><text x="891.0" y="497.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">输入的 Barrier</text><line x1="982" y1="483" x2="1040" y2="483" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="1046" y="440" width="130" height="86" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1111.0" y="477.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">快照</text><text x="1111.0" y="497.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">本算子</text><rect x="80" y="348" width="300" height="44" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="94" y="370" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">A 的 Barrier 先到 → 先到的输入被“对齐等待”，暂不处理</text><text x="620" y="582" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#d0021b" text-anchor="middle" font-weight="600" opacity="1">对齐时间过长 = Alignment Duration 高：典型原因是反压或数据倾斜。</text></svg>