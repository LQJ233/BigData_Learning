2" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="17" fill="#d0021b" text-anchor="middle" font-weight="700" opacity="1">5</text><rect x="40" y="340" width="1160" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="54" y="362" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">注意：①②③④ 都只是“搭积木”，真正的提交与运行发生在 ⑤ execute()。</text><text x="54" y="381" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">所以 print() 之前看不到任何输出，也解释了为什么“代码没写错但作业没跑”。</text><rect x="40" y="448" width="1160" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/><text x="54" y="470" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">对应 Web UI：④ 之后进 Submit New Job 上传 Jar；⑤ 之后进 Overview / Job 页面看状态。</text></svg>