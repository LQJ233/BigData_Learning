<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img"><defs><marker id="arrow-2563eb" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker><marker id="arrow-059669" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#059669"/></marker><marker id="arrow-d0021b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d0021b"/></marker><marker id="arrow-d97706" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d97706"/></marker><marker id="arrow-7c3aed" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/></marker><marker id="arrow-64748b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#64748b"/></marker><marker id="arrow-94a3b8" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#94a3b8"/></marker></defs><rect width="1240" height="560" fill="#ffffff"/><text x="620" y="34" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">三档语义：Source、Sink、Checkpoint 缺一不可</text><rect x="80" y="100" width="260" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="210.0" y="133" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">Source 可重放</text><rect x="350" y="100" width="260" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="480.0" y="133" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">Sink 事务/幂等</text><rect x="620" y="100" width="260" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="750.0" y="133" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">Checkpoint 开启</text><rect x="890" y="100" width="260" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="1020.0" y="133" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">端到端语义</text><rect x="80" y="168" width="260" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="210.0" y="205" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">否</text><rect x="350" y="168" width="260" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="480.0" y="205" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">否</text><rect x="620" y="168" width="260" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="750.0" y="205" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">否</text><rect x="890" y="168" width="260" height="60" rx="8" fill="#ffffff" stroke="#d0021b" stroke-width="1.4"/><text x="1020.0" y="205" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#d0021b" text-anchor="middle" font-weight="600" opacity="1">最多一次：可能丢，不重</text><rect x="80" y="244" width="260" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="210.0" y="281" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">是</text><rect x="350" y="244" width="260" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="480.0" y="281" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">否</text><rect x="620" y="244" width="260" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="750.0" y="281" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">是</text><rect x="890" y="244" width="260" height="60" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/><text x="1020.0" y="281" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600" opacity="1">至少一次：不丢，可能重</text><rect x="80" y="320" width="260" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="210.0" y="357" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">是</text><rect x="350" y="320" width="260" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="480.0" y="357" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">是</text><rect x="620" y="320" width="260" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="750.0" y="357" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">是</text><rect x="890" y="320" width="260" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.4"/><text x="1020.0" y="357" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#059669" text-anchor="middle" font-weight="600" opacity="1">精确一次：不丢不重</text><rect x="80" y="408" width="1080" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="94" y="430" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">容易忽略的一点：即使 Sink 支持事务，只要 Checkpoint 没开或者 Source 不可重放，</text><text x="94" y="449" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">端到端语义依然会降级。三者是乘法关系，不是加法关系。</text></svg>