<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img"><defs><marker id="arrow-2563eb" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker><marker id="arrow-059669" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#059669"/></marker><marker id="arrow-d0021b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d0021b"/></marker><marker id="arrow-d97706" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d97706"/></marker><marker id="arrow-7c3aed" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/></marker><marker id="arrow-64748b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#64748b"/></marker><marker id="arrow-94a3b8" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#94a3b8"/></marker></defs><rect width="1240" height="560" fill="#ffffff"/><text x="620" y="34" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">Checkpoint 快照与恢复：状态放在哪、怎么回来</text><rect x="60" y="110" width="260" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="190.0" y="149.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">运行中的 Task</text><text x="190.0" y="169.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">Keyed State / Operator State</text><text x="190.0" y="189.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">本地（Heap 或 RocksDB）</text><line x1="326" y1="165" x2="420" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><text x="373.0" y="158.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="600" opacity="1">Barrier 到达</text><rect x="426" y="110" width="300" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="576.0" y="149.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">状态快照</text><text x="576.0" y="169.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">• Heap：内存快照</text><text x="576.0" y="189.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">• RocksDB：增量 SST 文件</text><line x1="732" y1="165" x2="826" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><text x="779.0" y="158.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="600" opacity="1">上传</text><rect x="832" y="110" width="340" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1002.0" y="149.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">持久化存储</text><text x="1002.0" y="169.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">HDFS / S3 / OSS</text><text x="1002.0" y="189.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">JobManager 或 外部化目录</text><line x1="1002" y1="226" x2="1002" y2="300" stroke="#059669" stroke-width="2" marker-end="url(#arrow-059669)"/><text x="1002.0" y="256.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#059669" text-anchor="middle" font-weight="600" opacity="1">作业失败后</text><rect x="832" y="300" width="340" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1002.0" y="339.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">JobManager</text><text x="1002.0" y="359.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">读 _metadata：</text><text x="1002.0" y="379.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">算子 UID → 状态分配</text><line x1="826" y1="355" x2="732" y2="355" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="426" y="300" width="300" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="576.0" y="339.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">恢复</text><text x="576.0" y="359.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">按 KeyGroup 重新分配</text><text x="576.0" y="379.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">到新的并行度</text><line x1="420" y1="355" x2="326" y2="355" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="60" y="300" width="260" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="190.0" y="339.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">恢复后的 Task</text><text x="190.0" y="359.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">从最近一次成功的</text><text x="190.0" y="379.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">Checkpoint 继续处理</text><rect x="60" y="440" width="1112" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="74" y="462" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">恢复能否成功，取决于三件事：① 算子 UID 是否与快照一致；② State 的类型 / Schema 是否兼容；</text><text x="74" y="481" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">③ Savepoint / Checkpoint 文件是否仍然可读。三者任一不满足，作业会反复重启或直接 FAILED。</text></svg>