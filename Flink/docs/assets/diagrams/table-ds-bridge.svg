0.0" y="209.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">map/filter/process</text><rect x="840" y="120" width="320" height="130" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1000.0" y="169.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">Table</text><text x="1000.0" y="189.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">有 Schema、有列</text><text x="1000.0" y="209.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">SQL / Table API</text><line x1="406" y1="160" x2="834" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><text x="620.0" y="153.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="600" opacity="1">fromDataStream / createTemporaryView</text><line x1="834" y1="215" x2="406" y2="215" stroke="#059669" stroke-width="2" marker-end="url(#arrow-059669)"/><text x="620.0" y="208.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#059669" text-anchor="middle" font-weight="600" opacity="1">toDataStream / toChangelogStream</text><rect x="80" y="290" width="1080" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="94" y="312" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">toDataStream：只支持“有更新语义”的结果（append-only / upsert / retract），</text><text x="94" y="331" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">聚合结果通常需要 toChangelogStream 才能看到更新。</text><rect x="80" y="400" width="1080" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/><text x="94" y="422" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">转换之后仍然是一个普通作业：JobGraph、反压、Checkpoint、Metrics 全部一致。</text></svg>