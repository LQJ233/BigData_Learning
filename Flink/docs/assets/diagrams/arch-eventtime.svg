<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img"><defs><marker id="arrow-2563eb" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker><marker id="arrow-059669" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#059669"/></marker><marker id="arrow-d0021b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d0021b"/></marker><marker id="arrow-d97706" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d97706"/></marker><marker id="arrow-7c3aed" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/></marker><marker id="arrow-64748b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#64748b"/></marker><marker id="arrow-94a3b8" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#94a3b8"/></marker></defs><rect width="1240" height="560" fill="#ffffff"/><text x="620" y="34" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">事件时间、Watermark 与窗口触发</text><line x1="80" y1="400" x2="1180" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-64748b)"/><text x="1180" y="428" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="end" font-weight="400" opacity="1">事件时间 →</text><rect x="124" y="356" width="52" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="150" y="380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">e1</text><line x1="150" y1="396" x2="150" y2="402" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-2563eb)"/><rect x="224" y="356" width="52" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="250" y="380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">e2</text><line x1="250" y1="396" x2="250" y2="402" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-2563eb)"/><rect x="304" y="356" width="52" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="330" y="380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">e3</text><line x1="330" y1="396" x2="330" y2="402" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-2563eb)"/><rect x="404" y="356" width="52" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="430" y="380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">e4</text><line x1="430" y1="396" x2="430" y2="402" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-2563eb)"/><rect x="494" y="356" width="52" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="520" y="380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">e5</text><line x1="520" y1="396" x2="520" y2="402" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-2563eb)"/><rect x="594" y="356" width="52" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="620" y="380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">e6</text><line x1="620" y1="396" x2="620" y2="402" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-2563eb)"/><rect x="684" y="356" width="52" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="710" y="380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">e7</text><line x1="710" y1="396" x2="710" y2="402" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-2563eb)"/><rect x="794" y="356" width="52" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="820" y="380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">e8</text><line x1="820" y1="396" x2="820" y2="402" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-2563eb)"/><rect x="904" y="356" width="52" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="930" y="380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">e9</text><line x1="930" y1="396" x2="930" y2="402" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-2563eb)"/><rect x="1004" y="356" width="52" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="1030" y="380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">e10</text><line x1="1030" y1="396" x2="1030" y2="402" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-2563eb)"/><line x1="560" y1="300" x2="560" y2="396" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-d97706)"/><text x="560" y="288" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#d97706" text-anchor="middle" font-weight="700" opacity="1">Watermark = 最大事件时间 − 允许延迟</text><rect x="560" y="300" width="260" height="0" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.6"/><rect x="80" y="300" width="480" height="0" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.6"/><rect x="80" y="150" width="460" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/><text x="94" y="172" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">窗口 [0,10) 覆盖 e1…e6</text><text x="94" y="191" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1"></text><text x="94" y="210" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">• Watermark 越过窗口右边界 → 触发计算</text><text x="94" y="229" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">• 窗口触发后到达的 e_old → 属于迟到数据</text><text x="94" y="248" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">• 允许延迟内：可以再次触发更新结果</text><text x="94" y="267" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">• 超过延迟：进入 side output（如果配置了）</text><rect x="620" y="150" width="560" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4" stroke-dasharray="5 4"/><text x="634" y="172" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">三种典型的 Watermark 策略</text><text x="634" y="191" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1"></text><text x="634" y="210" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">• 单调递增 forMonotonousTimestamps：无乱序</text><text x="634" y="229" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">• 固定延迟 forBoundedOutOfOrderness：容忍乱序</text><text x="634" y="248" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">• withIdleness：某些分区长时间无数据时不再拖住整体</text><text x="634" y="267" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1"></text><rect x="620" y="300" width="560" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="634" y="322" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">多输入算子的 Watermark = 所有输入的最小值。</text><text x="634" y="341" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">只要一路不推进，窗口就永远不触发——这是“有数据但窗口不出结果”的头号原因。</text></svg>