<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img"><defs><marker id="arrow-2563eb" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker><marker id="arrow-059669" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#059669"/></marker><marker id="arrow-d0021b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d0021b"/></marker><marker id="arrow-d97706" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d97706"/></marker><marker id="arrow-7c3aed" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/></marker><marker id="arrow-64748b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#64748b"/></marker><marker id="arrow-94a3b8" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#94a3b8"/></marker></defs><rect width="1240" height="560" fill="#ffffff"/><text x="620" y="34" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">作业状态机：CREATED → RUNNING → RESTARTING → FAILED</text><rect x="60" y="130" width="190" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="155.0" y="169.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">CREATED</text><text x="155.0" y="189.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">已创建</text><line x1="256" y1="175" x2="320" y2="175" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="326" y="130" width="190" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="421.0" y="169.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">RUNNING</text><text x="421.0" y="189.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">正常执行</text><line x1="522" y1="150" x2="620" y2="130" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-d97706)"/><text x="571.0" y="133.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#d97706" text-anchor="middle" font-weight="600" opacity="1">任务失败</text><rect x="626" y="96" width="190" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="721.0" y="135.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">RESTARTING</text><text x="721.0" y="155.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">按策略重试</text><line x1="816" y1="141" x2="900" y2="175" stroke="#059669" stroke-width="2" marker-end="url(#arrow-059669)"/><text x="858.0" y="151.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#059669" text-anchor="middle" font-weight="600" opacity="1">恢复成功</text><line x1="902" y1="186" x2="826" y2="186" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-d97706)"/><text x="864.0" y="179.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#d97706" text-anchor="middle" font-weight="600" opacity="1">再次失败</text><line x1="721" y1="190" x2="721" y2="300" stroke="#d0021b" stroke-width="2" marker-end="url(#arrow-d0021b)"/><text x="721.0" y="238.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#d0021b" text-anchor="middle" font-weight="600" opacity="1">重试耗尽</text><rect x="626" y="306" width="190" height="90" rx="10" fill="#fef2f2" stroke="#d0021b" stroke-width="1.6"/><text x="721.0" y="345.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">FAILED</text><text x="721.0" y="365.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">终止，需人工介入</text><line x1="522" y1="200" x2="420" y2="306" stroke="#d0021b" stroke-width="2" marker-end="url(#arrow-d0021b)"/><rect x="326" y="306" width="190" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="421.0" y="345.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">CANCELED</text><text x="421.0" y="365.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">人工取消</text><line x1="816" y1="351" x2="900" y2="351" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-7c3aed)"/><text x="858.0" y="344.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#7c3aed" text-anchor="middle" font-weight="600" opacity="1">进入 Completed Jobs</text><rect x="906" y="306" width="280" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="1046.0" y="345.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">Completed Jobs</text><text x="1046.0" y="365.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">FINISHED / CANCELED / FAILED</text><rect x="60" y="430" width="1126" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="74" y="452" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">排查提示：RESTARTING 期间 Duration 会反复归零；FAILED 之后作业会出现在 Completed Jobs。</text><text x="74" y="471" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">看到 RESTARTING 就要立刻进 Exception History，看第一次失败的堆栈。</text></svg>