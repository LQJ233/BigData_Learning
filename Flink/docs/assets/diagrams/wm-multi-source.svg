<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img"><defs><marker id="arrow-2563eb" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker><marker id="arrow-059669" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#059669"/></marker><marker id="arrow-d0021b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d0021b"/></marker><marker id="arrow-d97706" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d97706"/></marker><marker id="arrow-7c3aed" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/></marker><marker id="arrow-64748b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#64748b"/></marker><marker id="arrow-94a3b8" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#94a3b8"/></marker></defs><rect width="1240" height="600" fill="#ffffff"/><text x="620" y="34" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">多输入作业的 Watermark：取所有输入的最小值</text><rect x="60" y="110" width="220" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="170.0" y="144.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">Source A</text><text x="170.0" y="164.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">快（Watermark 走得快）</text><rect x="60" y="250" width="220" height="80" rx="10" fill="#fef2f2" stroke="#d0021b" stroke-width="1.6"/><text x="170.0" y="284.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">Source B</text><text x="170.0" y="304.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">慢 / 某分区空闲</text><rect x="60" y="390" width="220" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="170.0" y="424.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">Source C</text><text x="170.0" y="444.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">正常</text><rect x="470" y="250" width="260" height="130" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="600.0" y="309.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">keyBy + 窗口算子</text><text x="600.0" y="329.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">多输入：需要等所有输入</text><line x1="286" y1="150" x2="464" y2="290" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><line x1="286" y1="290" x2="464" y2="300" stroke="#d0021b" stroke-width="2" marker-end="url(#arrow-d0021b)"/><line x1="286" y1="430" x2="464" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="790" y="250" width="400" height="130" rx="10" fill="#fef2f2" stroke="#d0021b" stroke-width="1.6"/><text x="990" y="282" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#d0021b" text-anchor="middle" font-weight="700" opacity="1">窗口的 Watermark = min(A, B, C)</text><text x="990" y="312" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">B 不推进 → 整个窗口不触发</text><text x="990" y="342" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">即使 A、C 早就越过了窗口边界</text><line x1="736" y1="315" x2="784" y2="315" stroke="#d0021b" stroke-width="2" marker-end="url(#arrow-d0021b)"/><rect x="60" y="500" width="1130" height="78" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="74" y="522" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">解决方案：withIdleness。对长时间没数据的分区，标记为 idle，不再参与最小值计算；</text><text x="74" y="541" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">但要注意：如果 B 只是“慢”而不是“空闲”，标记 idle 会让结果变快也变“不完整”。</text></svg>