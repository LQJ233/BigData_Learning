 text-anchor="middle" font-weight="600" opacity="1">同步查询</text><rect x="436" y="336" width="320" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="596.0" y="385.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">外部维表</text><text x="596.0" y="405.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">MySQL / HBase / Redis</text><rect x="60" y="470" width="1120" height="80" rx="8" fill="#fef2f2" stroke="#d0021b" stroke-width="1.4" stroke-dasharray="5 4"/><text x="74" y="492" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">必须优化：开缓存（lookup.cache.max-rows / ttl）、限制最大并发、设置超时与失败重试，</text><text x="74" y="511" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">否则每条记录一次同步查询 → 直接把 Lookup 算子变成瓶颈（回到 07-03 反压）。</text></svg>