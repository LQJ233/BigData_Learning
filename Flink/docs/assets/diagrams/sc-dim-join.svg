ans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">关键设计</text><text x="54" y="301" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">开 lookup cache（max-rows + ttl）</text><text x="54" y="320" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">限制最大并发与超时，避免拖垮主流</text><text x="54" y="339" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">维表变更不频繁时优先用缓存而不是每条查询</text><rect x="630.0" y="260" width="570.0" height="180" rx="8" fill="#fef2f2" stroke="#d0021b" stroke-width="1.4" stroke-dasharray="5 4"/><text x="644.0" y="282" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">常见坑</text><text x="644.0" y="301" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">缓存 ttl 过长 → 维度更新不及时</text><text x="644.0" y="320" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">查询无超时 → 反压直接传导到 Source</text><text x="644.0" y="339" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">维表主键为空 → 大量 NULL 落到同一个 Key</text><rect x="40" y="462" width="1160" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasha