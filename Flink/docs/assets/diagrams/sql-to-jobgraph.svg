30" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="888.0" y="199.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">物理计划</text><text x="888.0" y="219.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">算子树：WatermarkAssigner / WindowAggregate</text><line x1="750" y1="205.0" x2="776" y2="205.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><text x="774" y="132" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="17" fill="#d0021b" text-anchor="middle" font-weight="700" opacity="1">4</text><rect x="1032" y="140" width="208" height="130" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="1136.0" y="199.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">JobGraph</text><text x="1136.0" y="219.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">交给 Flink 运行时执行</text><line x1="998" y1="205.0" x2="1024" y2="205.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><text x="1022" y="132" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="17" fill="#d0021b" text-anchor="middle" font-weight="700" opacity="1">5</text><rect x="40" y="330" width="1160" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/><text x="54" y="352" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">结论：SQL 与 DataStream 只是写法不同，最终都会落成同一张 JobGraph。</text><rect x="40" y="428" width="1160" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4" stroke-dasharray="5 4"/><text x="54" y="450" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">所以 07（性能优化）/ 08（生产运维）/ 09（故障排查）里的所有手段，对 SQL 作业同样适用。</text></svg>