4" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><rect x="420" y="328" width="60" height="34" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><rect x="480" y="328" width="60" height="34" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><rect x="700" y="328" width="120" height="34" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="220" y="350" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">S0</text><text x="480" y="350" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">S1</text><text x="760" y="350" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">S2</text><rect x="60" y="430" width="1130" height="150" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="74" y="452" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">选择建议</text><text x="74" y="471" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">• 固定周期的统计（每分钟 PV）→ 滚动窗口，状态最小、语义最清晰</text><text x="74" y="490" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">• 需要平滑曲线（最近 10 分钟、每 5 秒更新）→ 滑动窗口，但状态量按 slide 放大</text><text x="74" y="509" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">• 用户行为会话 → 会话窗口，注意 gap 设置过大导致窗口长时间不触发</text><text x="74" y="528" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">• 事件时间窗口要配合 Watermark，否则窗口永远不会触发（见 10-08）</text></svg>