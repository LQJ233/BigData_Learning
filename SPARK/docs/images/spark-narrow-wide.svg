marker-end="url(#arrow-d0021b)"/><line x1="920" y1="208" x2="1085" y2="256" stroke="#d0021b" stroke-width="1" marker-end="url(#arrow-d0021b)"/><line x1="1085" y1="208" x2="755" y2="256" stroke="#d0021b" stroke-width="1" marker-end="url(#arrow-d0021b)"/><line x1="1085" y1="208" x2="920" y2="256" stroke="#d0021b" stroke-width="1" marker-end="url(#arrow-d0021b)"/><line x1="1085" y1="208" x2="1085" y2="256" stroke="#d0021b" stroke-width="1" marker-end="url(#arrow-d0021b)"/><text x="920" y="360" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">groupByKey / reduceByKey / join</text><text x="920" y="396" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">被切分成两个 Stage，中间落盘</text><text x="920" y="440" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#d0021b" text-anchor="middle" font-weight="600" opacity="1">Stage 边界 = Shuffle 边界</text></svg>