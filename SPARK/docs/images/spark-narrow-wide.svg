<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img"><defs><marker id="arrow-2563eb" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker><marker id="arrow-059669" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#059669"/></marker><marker id="arrow-d0021b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d0021b"/></marker><marker id="arrow-d97706" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d97706"/></marker><marker id="arrow-7c3aed" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/></marker><marker id="arrow-64748b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#64748b"/></marker><marker id="arrow-94a3b8" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#94a3b8"/></marker></defs><rect width="1240" height="600" fill="#ffffff"/><text x="620" y="34" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">窄依赖 vs 宽依赖：是否需要 Shuffle</text><rect x="40" y="70" width="560" height="420" rx="14" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/><text x="56" y="94" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#059669" text-anchor="start" font-weight="700" opacity="1">窄依赖 Narrow Dependency（不 shuffle）</text><text x="320" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">父 RDD 的每个分区最多被一个子分区使用</text><rect x="90" y="150" width="130" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="155" y="183" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">父分区 0</text><rect x="90" y="260" width="130" height="54" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="155" y="293" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">子分区 0</text><line x1="155" y1="208" x2="155" y2="256" stroke="#059669" stroke-width="2" marker-end="url(#arrow-059669)"/><rect x="255" y="150" width="130" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="320" y="183" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">父分区 1</text><rect x="255" y="260" width="130" height="54" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="320" y="293" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">子分区 1</text><line x1="320" y1="208" x2="320" y2="256" stroke="#059669" stroke-width="2" marker-end="url(#arrow-059669)"/><rect x="420" y="150" width="130" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="485" y="183" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">父分区 2</text><rect x="420" y="260" width="130" height="54" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="485" y="293" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">子分区 2</text><line x1="485" y1="208" x2="485" y2="256" stroke="#059669" stroke-width="2" marker-end="url(#arrow-059669)"/><text x="320" y="360" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">map / filter / flatMap / union</text><text x="320" y="396" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">可以流水线执行，同一个 Stage</text><text x="320" y="440" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#059669" text-anchor="middle" font-weight="600" opacity="1">不需要跨节点搬数据</text><rect x="640" y="70" width="560" height="420" rx="14" fill="none" stroke="#d0021b" stroke-width="1.6" stroke-dasharray="6 5"/><text x="656" y="94" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#d0021b" text-anchor="start" font-weight="700" opacity="1">宽依赖 Wide Dependency（要 shuffle）</text><text x="920" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">一个子分区依赖多个父分区，必须跨节点重分布</text><rect x="690" y="150" width="130" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="755" y="183" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="400" opacity="1">父分区 0</text><rect x="690" y="260" width="130" height="54" rx="8" fill="#fef2f2" stroke="#d0021b" stroke-width="1.6"/><text x="755" y="