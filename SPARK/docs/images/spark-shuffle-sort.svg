<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img"><defs><marker id="arrow-2563eb" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker><marker id="arrow-059669" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#059669"/></marker><marker id="arrow-d0021b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d0021b"/></marker><marker id="arrow-d97706" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d97706"/></marker><marker id="arrow-7c3aed" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#7c3aed"/></marker><marker id="arrow-64748b" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#64748b"/></marker><marker id="arrow-94a3b8" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#94a3b8"/></marker></defs><rect width="1240" height="640" fill="#ffffff"/><text x="620" y="34" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="700" opacity="1">SortShuffleManager（Spark 3.x 唯一实现）</text><rect x="40" y="70" width="1160" height="250" rx="14" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 5"/><text x="56" y="94" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="700" opacity="1">Map 端：写内存缓冲 → 溢写 → 合并成一个文件</text><rect x="60" y="130" width="250" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="185.0" y="179.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">写入内存缓冲</text><text x="185.0" y="199.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">默认 32KB，按分区+key 排序</text><text x="50" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="17" fill="#d0021b" text-anchor="middle" font-weight="700" opacity="1">1</text><rect x="350" y="130" width="250" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="475.0" y="179.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">溢写 spill</text><text x="475.0" y="199.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">缓冲满就落盘（多次）</text><line x1="316" y1="185.0" x2="342" y2="185.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><text x="340" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="17" fill="#d0021b" text-anchor="middle" font-weight="700" opacity="1">2</text><rect x="640" y="130" width="250" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="765.0" y="179.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">合并 merge</text><text x="765.0" y="199.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">多次溢写合并成 1 个文件</text><line x1="606" y1="185.0" x2="632" y2="185.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><text x="630" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="17" fill="#d0021b" text-anchor="middle" font-weight="700" opacity="1">3</text><rect x="930" y="130" width="250" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="1055.0" y="179.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">写索引文件</text><text x="1055.0" y="199.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">index 记录每个分区的偏移</text><line x1="896" y1="185.0" x2="922" y2="185.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><text x="920" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="17" fill="#d0021b" text-anchor="middle" font-weight="700" opacity="1">4</text><text x="620" y="292" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">map 端最终产物：1 个 data 文件 + 1 个 index 文件（每个 Map Task 各一套）</text><rect x="40" y="350" width="1160" height="250" rx="14" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/><text x="56" y="374" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="14" fill="#059669" text-anchor="start" font-weight="700" opacity="1">Reduce 端：按索引拉取自己那一份</text><rect x="60" y="410" width="250" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="185.0" y="459.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">读 index 文件</text><text x="185.0" y="479.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">知道自己要哪一段</text><rect x="350" y="410" width="250" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="475.0" y="459.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">Fetch</text><text x="475.0" y="479.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">跨节点拉取对应分区数据</text><line x1="316" y1="465.0" x2="342" y2="465.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="640" y="410" width="250" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="765.0" y="459.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">归并排序</text><text x="765.0" y="479.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">多个 Map 的段合并有序</text><line x1="606" y1="465.0" x2="632" y2="465.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="930" y="410" width="250" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1055.0" y="459.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="600" opacity="1">处理并输出</text><text x="1055.0" y="479.8" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400" opacity="1">交给 reduce 函数</text><line x1="896" y1="465.0" x2="922" y2="465.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-2563eb)"/><rect x="60" y="540" width="1120" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><text x="74" y="562" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, -apple-system, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="400" opacity="1">对比 HashShuffleManager：Map 端每个 Task 为每个 Reduce 分区各写一个文件，文件数 = map 数 × reduce 数，小文件爆炸。SortShuffle 把它们合并成 2 个文件。</text></svg>